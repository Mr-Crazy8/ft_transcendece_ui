<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Create a Post - FD Transcendence</title>
<!-- Tailwind CSS CDN with forms and container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Inter and Newsreader / Playfair Display -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&amp;display=swap" rel="stylesheet">
<script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Newsreader', 'Georgia', 'serif'],
          },
          colors: {
            dark: {
              base: '#0c0d11',
              panel: '#15161c',
              card: '#191a22',
              cardHover: '#1e202a',
              border: '#232530',
              borderLight: '#2c2e3b',
              muted: '#717686',
              text: '#f3f4f6',
              accent: '#5a52e0',
              accentHover: '#4e45d4'
            }
          }
        }
      }
    }
  </script>
<style data-purpose="base-styling">
    body {
      background-color: #0c0d11;
      color: #f3f4f6;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    
    /* Remove default focus outline and replace with subtle glow */
    input:focus, textarea:focus, select:focus {
      outline: none;
      box-shadow: none;
    }

    /* Custom select styling reset */
    select {
      background-image: none !important;
    }
  </style>
</head>
<body class="min-h-screen bg-[#0c0d11] text-gray-200 flex flex-col selection:bg-indigo-500/30 selection:text-white">
<!-- BEGIN: MainHeader -->
<header class="h-14 border-b border-[#1f212a] bg-[#0c0d11] px-6 flex items-center justify-between sticky top-0 z-40 select-none">
<!-- Brand Logo / Title -->
<div class="flex items-center gap-3">
<a class="text-[12px] font-bold tracking-[0.2em] text-[#e5e7eb] hover:text-white uppercase transition-colors" href="#">
        FD Transcendence
      </a>
</div>
<!-- Center Search Bar -->
<div class="w-full max-w-xl mx-8">
<div class="relative">
<input class="w-full h-8 pl-3.5 pr-4 text-xs bg-[#16171e] border border-[#232634] rounded-[5px] text-gray-300 placeholder-[#585c6d] focus:border-[#383d52] focus:bg-[#181a24] transition-all" placeholder="Search expertise, people, and ideas" type="text">
</div>
</div>
<!-- Right User Controls -->
<div class="flex items-center gap-4">
<button aria-label="Notifications" class="text-gray-400 hover:text-gray-200 transition-colors p-1" type="button">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
</button>
<!-- Profile Avatar Badge -->
<div class="w-7 h-7 rounded-full bg-[#272a38] text-[11px] font-medium text-gray-200 flex items-center justify-center border border-[#353a4d] cursor-pointer hover:border-gray-400 transition-colors">
        AE
      </div>
</div>
</header>
<!-- END: MainHeader -->
<!-- BEGIN: MainContentContainer -->
<div class="flex-1 flex max-w-full">
<!-- BEGIN: LeftSidebar -->
<aside class="w-56 shrink-0 border-r border-[#1f212a] px-3 py-6 hidden md:block">
<nav class="space-y-1">
<!-- Feed Link -->
<a class="flex items-center gap-3 px-3 py-2 text-[13px] font-medium text-gray-400 hover:text-gray-100 hover:bg-[#151720] rounded-md transition-all" href="#">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
          Feed
        </a>
<!-- Explore Link -->
<a class="flex items-center gap-3 px-3 py-2 text-[13px] font-medium text-gray-400 hover:text-gray-100 hover:bg-[#151720] rounded-md transition-all" href="#">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M12 21a9 9 0 100-18 9 9 0 000 18z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
<path d="M10.5 13.5l3-3m0 0l-1.5 4.5-4.5-1.5 3-3z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
          Explore
        </a>
<!-- Connections Link -->
<a class="flex items-center gap-3 px-3 py-2 text-[13px] font-medium text-gray-200 bg-[#161822] rounded-md transition-all" href="#">
<svg class="w-4 h-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
          Connections
        </a>
<!-- Messages Link -->
<a class="flex items-center gap-3 px-3 py-2 text-[13px] font-medium text-gray-400 hover:text-gray-100 hover:bg-[#151720] rounded-md transition-all" href="#">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
          Messages
        </a>
<!-- Notifications Link -->
<a class="flex items-center gap-3 px-3 py-2 text-[13px] font-medium text-gray-400 hover:text-gray-100 hover:bg-[#151720] rounded-md transition-all" href="#">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
          Notifications
        </a>
<!-- Settings Link -->
<a class="flex items-center gap-3 px-3 py-2 text-[13px] font-medium text-gray-400 hover:text-gray-100 hover:bg-[#151720] rounded-md transition-all" href="#">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
          Settings
        </a>
</nav>
</aside>
<!-- END: LeftSidebar -->
<!-- BEGIN: EditorWorkspace -->
<main class="flex-1 px-8 lg:px-12 py-8 max-w-6xl"><div class="max-w-3xl mx-auto py-4 px-4">
  <!-- Top Action & Navigation Bar -->
  <div class="flex items-center justify-between pb-8 mb-8 border-b border-[#1f212a]">
    <div class="flex items-center gap-4">
      <a class="text-xs text-[#9ca3af] hover:text-white flex items-center gap-1.5 transition-colors" href="#">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path d="M10 19l-7-7m0 0l7-7m-7 7h18" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
        </svg>
        Back to feed
      </a>
      <span class="text-[#333749]">|</span>
      <div class="flex items-center gap-1.5 text-xs text-[#717688]">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500/80"></span>
        Draft saved
      </div>
    </div>

    <!-- Right: Topic Selector & Publishing Controls -->
    <div class="flex items-center gap-3">
      <!-- Minimal Topic Badge / Selector -->
      <div class="relative flex items-center">
        <select class="bg-[#161720] border border-[#272938] hover:border-[#383d52] text-xs text-gray-300 py-1.5 pl-3 pr-7 rounded-[5px] appearance-none cursor-pointer focus:outline-none transition-colors" id="minimal-topic-select">
          <option selected="">Software Engineering</option>
          <option>System Architecture</option>
          <option>Machine Learning</option>
          <option>Engineering Leadership</option>
        </select>
        <div class="pointer-events-none absolute right-2 text-[#777d90]">
          <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
          </svg>
        </div>
      </div>

      <!-- Save Draft Button -->
      <button class="px-3 py-1.5 text-xs font-medium text-gray-400 hover:text-white transition-colors" type="button">
        Save draft
      </button>

      <!-- Publish Primary Button -->
      <button class="bg-[#5d55fa] hover:bg-[#5249f0] text-white text-xs font-medium px-4 py-1.5 rounded-[5px] transition-colors shadow-sm" type="button">
        Publish
      </button>
    </div>
  </div>

  <!-- Author Metadata Strip -->
  <div class="flex items-center gap-3 mb-8">
    <div class="w-8 h-8 rounded-full bg-[#20222e] text-[11px] font-semibold text-gray-200 flex items-center justify-center border border-[#333749]">
      AE
    </div>
    <div class="flex items-center gap-2 text-xs">
      <span class="font-medium text-white">Anass Elmendili</span>
      <span class="text-[#63687b]">·</span>
      <span class="text-[#8c92a4]">Software Engineering</span>
      <span class="text-[#f59e0b] ml-0.5" title="Verified Expert">
        <svg class="w-3.5 h-3.5 inline" fill="currentColor" viewBox="0 0 24 24">
          <path clip-rule="evenodd" d="M8.603 3.799A4.49 4.49 0 0112 2.25c1.357 0 2.573.6 3.397 1.549a4.49 4.49 0 013.498 1.307 4.491 4.491 0 011.307 3.497A4.49 4.49 0 0121.75 12a4.49 4.49 0 01-1.549 3.397 4.491 4.491 0 01-1.307 3.497 4.491 4.491 0 01-3.497 1.307A4.49 4.49 0 0112 21.75a4.49 4.49 0 01-3.397-1.549 4.49 4.49 0 01-3.498-1.306 4.491 4.491 0 01-1.307-3.498A4.49 4.49 0 012.25 12c0-1.357.6-2.573 1.549-3.397a4.49 4.49 0 011.307-3.497 4.49 4.49 0 013.497-1.307zm7.007 6.387a.75.75 0 10-1.22-.872l-3.236 4.53L9.53 12.22a.75.75 0 00-1.06 1.06l2.25 2.25a.75.75 0 001.14-.094l3.75-5.25z" fill-rule="evenodd"></path>
        </svg>
      </span>
    </div>
  </div>

  <!-- Writing Canvas: Post Title -->
  <div class="mb-6">
    <textarea class="w-full bg-transparent border-0 px-0 py-0 text-[36px] font-serif font-normal text-[#f4f4f6] placeholder-[#505466] focus:ring-0 focus:border-0 resize-none leading-tight" id="post-title" placeholder="Give your idea a title..." rows="1" style="height: 54px;"></textarea>
  </div>

  <!-- Minimal Floating/Inline Toolbar -->
  <div class="sticky top-16 z-30 bg-[#0c0d11]/90 backdrop-blur py-2 my-4 border-y border-[#1f212a] flex items-center gap-5 text-[#888e9f]">
    <button aria-label="Bold" class="font-bold text-[13px] hover:text-white transition-colors" type="button">B</button>
    <button aria-label="Italic" class="italic font-serif text-[14px] hover:text-white transition-colors" type="button">I</button>
    <button aria-label="Heading 2" class="text-[12px] font-medium tracking-tight hover:text-white transition-colors" type="button">H₂</button>
    <button aria-label="Blockquote" class="hover:text-white transition-colors text-xs font-serif italic" type="button">“ ”</button>
    <button aria-label="Bulleted List" class="hover:text-white transition-colors" type="button">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
      </svg>
    </button>
    <button aria-label="Insert Link" class="hover:text-white transition-colors" type="button">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
      </svg>
    </button>
    <button aria-label="Code Block" class="hover:text-white transition-colors" type="button">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
      </svg>
    </button>
    <button aria-label="Insert Image" class="hover:text-white transition-colors" type="button">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
      </svg>
    </button>
  </div>

  <!-- Writing Canvas: Body Content -->
  <div class="mt-6">
    <textarea class="w-full bg-transparent border-0 px-0 pt-2 text-[15px] leading-[1.8] text-gray-200 placeholder-[#585c6d] focus:ring-0 focus:border-0 resize-none font-normal" id="post-body" placeholder="Share an insight, challenge an assumption, or explain something only experience could teach you..." rows="16"></textarea>
  </div>
</div></main>
<!-- END: EditorWorkspace -->
</div>
<!-- END: MainContentContainer -->


</body></html>
